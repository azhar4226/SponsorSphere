{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='src/login.css') }}" />
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% endblock %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="container">
    <div class="logo-area">
        <img class="logo" src="{{ url_for('static', filename='Sphere.png') }}" alt="Sphere" />
    </div>
    <div class="signup-area">
        <div class="welcome">
            <h3>GET STARTED</h3>
            <h5>Sign Up</h5>
        </div>
        <form method="POST" class="signup-form">
          
          <div class = "field-group">
            <div class="form-field-wrapper">
              <label for="firstName" class="label">NAME</label>
              <input type="text" id="firstName" name="firstName" required class="input-field" />
            </div>
            
            <div class="form-field-wrapper">
              <label class="label" for="email">EMAIL</label>
              <input type="email" name="email" id="email" required class="input-field" />
            </div>
          </div>

          <div class = "field-group">
            <div class="form-field-wrapper">
                <label class="label" for="role">ROLE</label>
                <select name="role" id="role" class="input-field">
                    <option value="Sponsor">Sponsor</option>
                    <option value="Influencer">Influencer</option>
                </select>
            </div>

            <div class="form-field-wrapper">
                <label for="niche" class="label">NICHE</label>
                <select name="niche" id="niche" class="input-field">
                    <option value="">Please select</option>
                    <option value="Tech">Tech</option>
                    <option value="Fashion and Beauty">Fashion and Beauty</option>
                    <option value="Fitness and Wellness">Fitness and Wellness</option>
                    <option value="Travel">Travel</option>
                    <option value="Food">Food</option>
                    <option value="Lifestyle">Lifestyle</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Finance and Investing">Finance and Investing</option>
                    <option value="Entertainment and Pop Culture">Entertainment and Pop Culture</option>
                </select>
            </div>
          </div>
          <div class="field-group">

            <div class="form-field-wrapper">
              <label class="label" for="password1">PASSWORD</label>
              <input type="password" name="password1" id="password1" required class="input-field" />
            </div>
            
            <div class="form-field-wrapper">
              <label class="label" for="password2">CONFIRM PASSWORD</label>
              <input type="password" name="password2" id="password2" required class="input-field" />
            </div>
          </div>

            <div class="login">
                <span>Already have an account?</span>
                <a href="/">Login</a>
            </div>

            <button type="submit" class="signup-btn">
                Create Account <ion-icon name="arrow-forward-sharp"></ion-icon>
            </button>
        </form>
    </div>
</div>
{% endblock %}
